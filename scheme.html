<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ayushman Bharat Scheme Helper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f9f9;
      margin: 0;
      padding: 0;
    }
  h1{
    color:#08b09c;
    font-size: 40px;
  }
    header {
      background:  #2c3542;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .container {
      width: 70%;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      color: #00695c;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    label {
      font-weight: bold;
    }
    input, textarea, select {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 95%;
    }
    button {
      grid-column: span 2;
      padding: 10px;
      background: #00695c;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #004d40;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #e0f2f1;
      border-radius: 10px;
      display: none;
    }
    a {
      color: #004d40;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ayushman Bharat Scheme Assistance</h1>
    <p>Find healthcare benefits and claims you may be eligible for</p>
  </header>

  <div class="container">
    <h2>Enter Your Details</h2>
    <form id="schemeForm">
      <div>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" required>
      </div>
      <div>
        <label for="age">Age:</label><br>
        <input type="number" id="age" required>
      </div>
      <div>
        <label for="phone">Phone Number:</label><br>
        <input type="text" id="phone" required>
      </div>
      <div>
        <label for="address">Address:</label><br>
        <textarea id="address" rows="2" required></textarea>
      </div>
      <div>
        <label for="symptoms">Symptoms / Disease:</label><br>
        <textarea id="symptoms" rows="2"></textarea>
      </div>
      <div>
        <label for="category">Category:</label><br>
        <select id="category" required>
          <option value="">-- Select Category --</option>
          <option value="rural">Rural Household</option>
          <option value="urban">Urban Household</option>
          <option value="sc">SC/ST Category</option>
          <option value="other">Other</option>
        </select>
      </div>
      <button type="submit">Check Eligibility</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById("schemeForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      let name = document.getElementById("name").value;
      let age = document.getElementById("age").value;
      let phone = document.getElementById("phone").value;
      let address = document.getElementById("address").value;
      let symptoms = document.getElementById("symptoms").value;
      let category = document.getElementById("category").value;
      let resultBox = document.getElementById("result");

      let userPrompt = `
        User details:
        Name: ${name}
        Age: ${age}
        Phone: ${phone}
        Address: ${address}
        Symptoms/Disease: ${symptoms}
        Category: ${category}

        Based on this information, suggest Ayushman Bharat / PM-JAY scheme eligibility, 
        benefits, and possible claims for this person in India. Respond in simple points.
      `;

      resultBox.innerHTML = "<p>⏳ Checking eligibility, please wait...</p>";
      resultBox.style.display = "block";

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer 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"   // <-- put your key here
          },
          body: JSON.stringify({
            model: "llama3-8b-8192",
            messages: [
              { role: "system", content: "You are an assistant that explains Ayushman Bharat scheme eligibility and claims clearly." },
              { role: "user", content: userPrompt }
            ]
          })
        });

        const data = await response.json();

        if (data.choices && data.choices.length > 0) {
          let output = data.choices[0].message.content;
          resultBox.innerHTML = `
            <h3>Dear ${name}, here are your scheme benefits:</h3>
            <p>${output.replace(/\n/g, "<br>")}</p>
            <p>👉 Visit official Ayushman Bharat site: 
            <a href="https://pmjay.gov.in" target="_blank">Ayushman Bharat - PM-JAY</a></p>`;
        } else {
          resultBox.innerHTML = "<p>⚠️ Could not fetch response. Try again later.</p>";
        }
      } catch (error) {
        console.error(error);
        resultBox.innerHTML = "<p>❌ Error connecting to scheme advisor service.</p>";
      }
    });
  </script>
</body>
</html>
